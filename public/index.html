        <path stroke-width="1" d="M0 0 C7 -9 21 -10 30 0 C21 10 7 9 0 0 Z"/>
        <path stroke-width=".7" d="M2 0 H25"/>
      </g>

      <g id="blossom" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
        <path d="M0 -2 C-5 -7 -4 -13 0 -13 C4 -13 5 -7 0 -2 Z"/>

          <path d="M2 2 C8 68 44 122 108 150 S188 190 214 200"/>
          <path d="M2 2 C40 30 74 66 96 104" opacity=".7"/>

        <g color="currentColor">

          <use href="#blossom" transform="translate(96 104) scale(.8)"/>
          <use href="#bud" transform="translate(196 206) rotate(160) scale(.9)"/>
          <use href="#bud" transform="translate(206 196) rotate(110) scale(.9)"/>
        </g>
      </symbol>

      <!-- Pointed Mughal-style arch with a second inner line -->
      <symbol id="arch" viewBox="0 0 320 460" overflow="visible">
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="1.1" d="M10 460 V214 C10 128 98 84 160 10 C222 84 310 128 310 214 V460"/>
          <path stroke-width=".7" d="M26 460 V216 C26 138 108 96 160 32 C212 96 294 138 294 216 V460"/>

        </g>
        <path d="M160 -8 L164 -3 L160 2 L156 -3 Z" fill="none" stroke="currentColor" stroke-width=".8"/>
      </symbol>

      <!-- Thin divider with a small diamond -->
      <symbol id="rule" viewBox="0 0 200 20" overflow="visible">
        <g fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round">
          <path d="M0 10 H84 M116 10 H200"/>
          <path d="M100 4 L106 10 L100 16 L94 10 Z"/>
        </g>
        <circle cx="88" cy="10" r="1.1" fill="currentColor"/>
        <circle cx="112" cy="10" r="1.1" fill="currentColor"/>

      <!-- Small botanical flourish for headings -->
